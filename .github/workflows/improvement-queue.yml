name: Collect textbook feedback
on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: textbook-feedback
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only trusted default-branch code. Issue bodies are quoted data, never shell input.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/collect-improvements.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: improvement-review-packet
          path: work/improvement-queue/
          retention-days: 30
