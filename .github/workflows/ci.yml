name: Check textbook
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- book/*.md packages/content/python packages/content/ai-development packages/content/programming-index.generated.json packages/content/translations/en apps/web/src/i18n/content-labels.en.generated.json
      - uses: actions/upload-artifact@v4
        with:
          name: ai-university-language-sites
          path: |
            dist/
            dist-en/
